[project]
name = "ai-act-check"
version = "0.1.0"
description = "Classify AI use cases under the EU AI Act with rules, grounded LLM judgement and human review."
authors = [
    { name = "Ramazan Karisan" }
]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.163.1",
    "lxml>=6.1.3",
    "pydantic>=2.14.3",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.16.2",
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "pyyaml>=6.0.3",
    "ruff>=0.17.5",
    "types-pyyaml>=6.0.12.20261113",
]

[tool.uv]
# Fail fast with a clear message when a local uv is too old for the uv_build backend.
# Keep in sync with the lower bound of uv_build in [build-system].
required-version = ">=0.13.8"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # makes the top-level `evals` package importable in tests

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "scripts", "evals"]

[tool.coverage.run]
source = ["ai_act_check", "evals"]
branch = true
