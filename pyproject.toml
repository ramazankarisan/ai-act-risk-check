[project]
name = "ai-act-check"
version = "0.1.0"
description = "Classify AI use cases under the EU AI Act with rules, grounded LLM judgement and human review."
authors = [
    { name = "Ramazan Karisan" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.163.1",
    "pydantic>=2.14.3",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.10.11,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.16.2",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
