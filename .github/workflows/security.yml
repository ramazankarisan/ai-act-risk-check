name: Security

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  pull_request:
    paths: [uv.lock]
  push:
    branches: [main]
    paths: [uv.lock]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.4.0

      - name: Audit locked dependencies for known vulnerabilities
        run: |
          uv export --locked --no-emit-project --format requirements-txt > requirements-audit.txt
          uvx pip-audit --requirement requirements-audit.txt --require-hashes --disable-pip
